apiVersion: v1
kind: Namespace
metadata:
  name: copilot-mvp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-api
  namespace: copilot-mvp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copilot-job-manager
  namespace: copilot-mvp
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copilot-job-manager
  namespace: copilot-mvp
subjects:
- kind: ServiceAccount
  name: copilot-api
  namespace: copilot-mvp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: copilot-job-manager
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: copilot-mvp-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/copilot-mvp
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copilot-mvp-data
  namespace: copilot-mvp
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
